
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DealFinder Flights</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5fb;
      color: #172033;
    }

    header {
      background: linear-gradient(120deg, #245bd6, #7435d4);
      color: white;
      text-align: center;
      padding: 42px 20px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 38px;
    }

    header p {
      margin: 0;
      font-size: 17px;
    }

    main {
      width: min(900px, 94%);
      margin: 30px auto;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input, select, button {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid #ccd2df;
      font-size: 16px;
    }

    button {
      margin-top: 22px;
      background: #2456c5;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1744a9;
    }

    .results {
      margin-top: 25px;
      display: grid;
      gap: 14px;
    }

    .provider {
      border: 1px solid #dce1eb;
      border-radius: 12px;
      padding: 18px;
      background: #fafbfe;
    }

    .provider h3 {
      margin: 0 0 8px;
    }

    .provider a {
      display: inline-block;
      margin-top: 10px;
      padding: 11px 15px;
      border-radius: 8px;
      background: #2456c5;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .note {
      margin-top: 20px;
      font-size: 14px;
      color: #5d6678;
      line-height: 1.5;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 30px;
      }

      .card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>DealFinder</h1>
    <p>Compare flight deals from multiple websites</p>
  </header>

  <main>
    <div class="card">
      <h2>Find Cheap Flights</h2>

      <div class="grid">
        <div>
          <label for="from">From</label>
          <input id="from" type="text" placeholder="Brisbane or BNE">
        </div>

        <div>
          <label for="to">To</label>
          <input id="to" type="text" placeholder="Delhi or DEL">
        </div>

        <div>
          <label for="departure">Departure date</label>
          <input id="departure" type="date">
        </div>

        <div>
          <label for="return">Return date</label>
          <input id="return" type="date">
        </div>

        <div>
          <label for="passengers">Passengers</label>
          <select id="passengers">
            <option value="1">1 passenger</option>
            <option value="2">2 passengers</option>
            <option value="3">3 passengers</option>
            <option value="4">4 passengers</option>
            <option value="5">5 passengers</option>
            <option value="6">6 passengers</option>
          </select>
        </div>

        <div>
          <label for="cabin">Cabin class</label>
          <select id="cabin">
            <option value="economy">Economy</option>
            <option value="premiumeconomy">Premium Economy</option>
            <option value="business">Business</option>
            <option value="first">First</option>
          </select>
        </div>
      </div>

      <button onclick="searchFlights()">Search Live Flight Deals</button>

      <div id="results" class="results"></div>

      <div class="note">
        DealFinder does not invent prices. The buttons open live searches on the
        providers’ own websites. Final prices, baggage, availability and booking
        conditions are confirmed on the provider website.
      </div>
    </div>
  </main>

  <script>
    function formatDate(dateValue) {
      if (!dateValue) return "";
      return dateValue.replaceAll("-", "");
    }

    function searchFlights() {
      const from = document.getElementById("from").value.trim();
      const to = document.getElementById("to").value.trim();
      const departure = document.getElementById("departure").value;
      const returnDate = document.getElementById("return").value;
      const passengers = document.getElementById("passengers").value;
      const cabin = document.getElementById("cabin").value;
      const results = document.getElementById("results");

      if (!from || !to || !departure) {
        alert("Please enter From, To and Departure date.");
        return;
      }

      const start = formatDate(departure);
      const end = formatDate(returnDate);

      const googleUrl =
        "https://www.google.com/travel/flights?q=" +
        encodeURIComponent(
          "Flights from " + from + " to " + to +
          " on " + departure +
          (returnDate ? " returning " + returnDate : "") +
          ", " + passengers + " passenger(s), " + cabin
        );

      const skyscannerUrl =
        "https://www.skyscanner.com/transport/flights/" +
        encodeURIComponent(from) + "/" +
        encodeURIComponent(to) + "/" +
        start +
        (end ? "/" + end : "") +
        "/";

      const kayakUrl =
        "https://www.kayak.com/flights/" +
        encodeURIComponent(from) + "-" +
        encodeURIComponent(to) + "/" +
        departure +
        (returnDate ? "/" + returnDate : "") +
        "?sort=bestflight_a";

      results.innerHTML = `
        <div class="provider">
          <h3>Google Flights</h3>
          <p>Compare airlines, timings and current fares.</p>
          <a href="${googleUrl}" target="_blank" rel="noopener">
            Open Google Flights
          </a>
        </div>

        <div class="provider">
          <h3>Skyscanner</h3>
          <p>Check available flight deals and booking options.</p>
          <a href="${skyscannerUrl}" target="_blank" rel="noopener">
            Open Skyscanner
          </a>
        </div>

        <div class="provider">
          <h3>KAYAK</h3>
          <p>Compare flight offers from different travel providers.</p>
          <a href="${kayakUrl}" target="_blank" rel="noopener">
            Open KAYAK
          </a>
        </div>
      `;
    }
  </script>
</body>
</html>
